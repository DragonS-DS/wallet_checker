[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet_checker"
version = "2.1"
description = "Check Solana and Ethereum balances derived from a mnemonic"
authors = [{ name = "DragonS" }]
license = "MIT"
license-files = ["LICENCE"]
readme = "README.md"
dependencies = [
    "solana",
    "solders",
    "bip_utils",
    "web3"
]
requires-python = ">=3.7"

[tool.setuptools]
packages = ["wallet_checker"]

[project.urls]
Homepage = "https://github.com/DragonS-DS/wallet_checker"
Repository = "https://github.com/DragonS-DS/wallet_checker"

[project.scripts]
wallet-checker = "wallet_checker.cli:main"